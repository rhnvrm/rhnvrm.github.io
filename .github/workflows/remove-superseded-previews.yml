name: Remove superseded previews
on:
  push:
    branches: [revamp/github-workbench]
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const runIds = [39253031764, 39253047451, 39253258794, 39253251862];
            for (const run_id of runIds) {
              try {
                await github.rest.actions.deleteWorkflowRun({...context.repo, run_id});
                core.info(`Removed superseded run ${run_id} and its artifacts`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
